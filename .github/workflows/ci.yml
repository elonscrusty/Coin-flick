name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: bash tools/setup_tools.sh
      - name: Type check, compile, rule tests, Rojo build
        run: bash tools/check.sh
